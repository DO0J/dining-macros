# Twice a day: download the menus, clean them, and save any new versions to the repo.
# If anything changed, republish the site.
# Can also be started by hand from the Actions tab.
name: Update menus

on:
  schedule:
    # GitHub uses UTC: 10:17 and 18:17 UTC = 6:17 am and 2:17 pm in Kingston (an hour earlier in winter).
    # Off the hour because GitHub is busiest at :00.
    - cron: "17 10,18 * * *"
  workflow_dispatch:

# Never run two updates at once.
concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Write access to this repo only, for this run only (GitHub's built-in token, no password stored).
    permissions:
      contents: write
    env:
      TZ: America/Toronto   # so "today" and archive timestamps match Kingston time
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - run: python fetch_menus.py
      - run: python clean_menus.py
      - id: save
        name: Commit new menu versions
        run: |
          if [ -z "$(git status --porcelain data/raw)" ]; then
            echo "No new menu versions."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw web/data/menus.json
          git commit -m "Update menus $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main   # in case you pushed something meanwhile
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made by this workflow don't trigger deploy.yml by themselves, so call it here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
