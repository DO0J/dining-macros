# Publishes the web/ folder to GitHub Pages.
# Runs on every push to main, and can be started by hand from the Actions tab.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these permissions to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# If two deploys overlap, let the newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
