<!doctype html>

<body>
  <header class="topbar">
    <h1>Hall Macros</h1>
    <span id="data-age" class="data-age"></span>

    Use Settings → Export to save a copy.

  <main id="main" tabindex="-1"><p class="loading">Loading menus…</p></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/week" data-tab="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>

      <span>Settings</span>
    </a>
  </nav>

  <dialog id="info" aria-labelledby="info-title">
    <div id="info-body"></div>
    <form method="dialog"><button class="btn wide">Close</button></form>
  </dialog>
